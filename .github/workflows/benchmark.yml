name: Performance & Load Benchmark (On-Demand / Scheduled)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of target InfraPulse backend server'
        required: false
        default: 'http://localhost:5000'
  schedule:
    # Run weekly on Sunday midnight UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  benchmark:
    name: Execute Full Performance & RCA Evaluation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrapulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Run Database Migrations & Seed
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: infrapulse_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          npm run db:migrate --prefix backend
          npm run db:seed --prefix backend

      - name: Start Background Server
        env:
          NODE_ENV: test
          PORT: 5000
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: infrapulse_test
          PGUSER: postgres
          PGPASSWORD: postgres
          NOTIFICATION_MOCK_MODE: 'true'
        run: |
          node backend/src/server.js &
          sleep 5

      - name: Run Full Performance & RCA Evaluation Suite
        run: node tests/performance/runAllBenchmarks.js

      - name: Archive Benchmark Report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/benchmark-report.json

