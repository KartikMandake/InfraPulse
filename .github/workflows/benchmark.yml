# Phase 25: build/validate/plan only. No publication or deployment commands.
name: Isolated performance benchmark
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 0 * * 0
permissions:
  contents: read
concurrency:
  group: Isolated performance benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: ${{ github.event_name != 'schedule' || vars.ENABLE_SCHEDULED_BENCHMARKS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: infrapulse-ci-disposable-password-only
          POSTGRES_DB: infrapulse_ci_backend
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: infrapulse_ci_backend
      PGDATABASE_TEST: infrapulse_ci_backend
      PGUSER: postgres
      PGPASSWORD: infrapulse-ci-disposable-password-only
      PGSSLMODE: disable
      CI_DISPOSABLE_DATABASE: "true"
      AWS_LIFECYCLE_MUTATIONS_ENABLED: "false"
      DOCKER_LIFECYCLE_ENABLED: "false"
      KUBERNETES_LIFECYCLE_ENABLED: "false"
      REMEDIATION_EXECUTION_ENABLED: "false"
      REMEDIATION_PRODUCTION_ENABLED: "false"
      NOTIFICATION_MOCK_MODE: "true"
      NOTIFICATION_WORKER_ENABLED: "false"
      AUTO_MIGRATE: "false"
      AUTO_SEED: "false"
      CI_RESULTS_DIR: reports/ci
      TARGET_URL: http://127.0.0.1:5085
      PORT: "5085"
      BIND_HOST: 127.0.0.1
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |-
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: |-
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts
      - run: node scripts/ci/database.mjs
      - name: Start disposable local target and wait for readiness
        run: |-
          node backend/src/entrypoint.js server > /tmp/infrapulse-benchmark.log 2>&1 &
          node scripts/ci/wait-health.mjs
      - name: Existing performance suite (not a release gate)
        run: node tests/performance/runAllBenchmarks.js
      - name: Upload benchmark-report-${{ github.sha }}
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-report-${{ github.sha }}
          path: reports/benchmark-report.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
