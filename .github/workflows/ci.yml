# Phase 25: build/validate/plan only. No publication or deployment commands.
name: InfraPulse CI Quality Gates
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:
    inputs:
      export_images:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: infrapulse-ci-disposable-password-only
          POSTGRES_DB: infrapulse_ci_backend
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: infrapulse_ci_backend
      PGDATABASE_TEST: infrapulse_ci_backend
      PGUSER: postgres
      PGPASSWORD: infrapulse-ci-disposable-password-only
      PGSSLMODE: disable
      CI_DISPOSABLE_DATABASE: "true"
      AWS_LIFECYCLE_MUTATIONS_ENABLED: "false"
      DOCKER_LIFECYCLE_ENABLED: "false"
      KUBERNETES_LIFECYCLE_ENABLED: "false"
      REMEDIATION_EXECUTION_ENABLED: "false"
      REMEDIATION_PRODUCTION_ENABLED: "false"
      NOTIFICATION_MOCK_MODE: "true"
      NOTIFICATION_WORKER_ENABLED: "false"
      AUTO_MIGRATE: "false"
      AUTO_SEED: "false"
      CI_RESULTS_DIR: reports/ci
    steps:
      - &a1
        name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - &a2
        name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |-
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: |-
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts
      - name: Fresh isolated migrations and replay
        run: node scripts/ci/database.mjs
      - name: Existing tests under mandatory safe profile
        run: node scripts/ci/tests.mjs
      - name: Production startup and actual API/PostgreSQL smoke
        run: node scripts/ci/integration.mjs
      - name: Upload backend-results-${{ github.sha }}
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-results-${{ github.sha }}
          path: |-
            reports/ci/test-*.tap
            reports/ci/test-results.json
            reports/ci/excluded-tests.json
            reports/ci/migrations.json
            reports/ci/integration.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
  frontend-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *a1
      - *a2
      - run: npm ci --prefix frontend
      - name: Frontend tests include production Vite build
        run: |-
          mkdir -p reports/ci
          npm test --prefix frontend > reports/ci/frontend-tests.log 2>&1
      - name: Verify built assets
        run: node scripts/ci/frontend.mjs
      - name: Upload frontend-build-${{ github.sha }}
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-build-${{ github.sha }}
          path: |-
            frontend/dist/
            reports/ci/frontend-build.json
            reports/ci/frontend-tests.log
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
  security-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a1
      - *a2
      - name: Install exact lockfile trees
        run: |-
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts
          npm ci --prefix frontend
      - name: Workflow security, versions and JavaScript syntax
        run: node scripts/ci/policy.mjs
      - name: Release and pipeline safety regressions
        run: node --test --test-reporter=tap tests/cicd/*.test.mjs > reports/ci/release-tests.tap
      - name: Secret patterns and clean CI checkout
        run: |-
          node scripts/securityAudit.js
          node scripts/ci/checkout-secrets.mjs
      - name: Dependency vulnerability gates
        run: |-
          npm audit --audit-level=high
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high
      - name: Verified actionlint
        run: |-
          ACTIONLINT_BIN=$(node scripts/ci/install-tool.mjs actionlint)
          "$ACTIONLINT_BIN" -pyflakes= .github/workflows/*.yml
      - name: Upload policy-results-${{ github.sha }}
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: policy-results-${{ github.sha }}
          path: |-
            reports/ci/policy.json
            reports/ci/release-tests.tap
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-quality-gate
      - frontend-quality-gate
      - security-and-policy
    env:
      EXPORT_IMAGES: ${{ inputs.export_images || false }}
    steps:
      - *a1
      - *a2
      - name: Static production Compose safety
        run: |-
          node scripts/validate-production-compose.mjs --fixture
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Install verified Trivy
        run: |-
          TRIVY_BIN=$(node scripts/ci/install-tool.mjs trivy)
          echo "TRIVY_BIN=$TRIVY_BIN" >> "$GITHUB_ENV"
      - name: Build immutable-tag images and scan; never push
        run: node scripts/ci/images.mjs
      - name: Upload image-diagnostics-${{ github.sha }}
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-diagnostics-${{ github.sha }}
          path: |-
            reports/ci/images/*.json
            reports/ci/images/*-build.log
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Upload validated-images-${{ github.sha }}
        if: ${{ success() && inputs.export_images }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validated-images-${{ github.sha }}
          path: reports/ci/images/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs:
      - backend-quality-gate
      - frontend-quality-gate
      - security-and-policy
      - container-validation
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS);if(!Object.values(jobs).every(j=>j.result==="success"))process.exit(1)'
