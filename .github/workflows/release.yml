# Phase 25: build/validate/plan only. No publication or deployment commands.
name: InfraPulse release preparation
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Version matching all package/lock files
      acknowledgement:
        type: choice
        required: true
        options:
          - PREPARE ONLY
        description: No publication or deployment
permissions:
  contents: read
  actions: read
concurrency:
  group: InfraPulse release preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      export_images: true
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: release-review
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |-
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Download same-run scanned images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: validated-images-${{ github.sha }}
          path: reports/ci/images
          digest-mismatch: error
      - name: Prepare unpublished candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ACK: ${{ inputs.acknowledgement }}
        run: |-
          test "$RELEASE_ACK" = "PREPARE ONLY"
          node scripts/release/prepare.mjs
      - name: Upload release-candidate-${{ inputs.version }}-${{ github.sha }}
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-${{ inputs.version }}-${{ github.sha }}
          path: reports/ci/candidate/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: No publication
        run: echo "Candidate only. No images, tags or GitHub releases published; production remains NO-GO." >> "$GITHUB_STEP_SUMMARY"
