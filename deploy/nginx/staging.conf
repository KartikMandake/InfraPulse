# ==============================================================================
# InfraPulse - Staging Reverse Proxy Configuration (Nginx)
# Location: /etc/nginx/conf.d/staging.conf
# ==============================================================================

# Rate Limiting Zone: 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Upstream Backend API Service
upstream backend_api {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend Static Asset Service
upstream frontend_app {
    server frontend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# Port 80: HTTP Redirect to HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.infrapulse.internal staging.infrapulse.io _;

    # ACME Challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all remaining plaintext traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Port 443: HTTPS Reverse Proxy & TLS Termination
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.infrapulse.internal staging.infrapulse.io;

    # TLS Certificate & Key (Mount from secret volume / certbot)
    ssl_certificate /etc/nginx/ssl/live/staging.infrapulse.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/staging.infrapulse.io/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client Request Size Limits (Matches 2MB OTel / webhook limit)
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # 1. API Endpoints Proxying
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;

        # WebSocket & Connection Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts & Buffering
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Static Assets Caching
    location /assets/ {
        proxy_pass http://frontend_app/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Frontend Single Page Application (SPA)
    location / {
        proxy_pass http://frontend_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Ingress Health Check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "staging-ingress-healthy\n";
    }
}

