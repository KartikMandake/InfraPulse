# Preparation only. No resources are created by config validation.
# See docs/PRODUCTION_DEPLOYMENT_RUNBOOK.md; all release gates must pass first.
name: infrapulse-production
x-application: &application
  image: ${BACKEND_IMAGE:?Set a tested backend image reference pinned by digest}
  init: true
  restart: unless-stopped
  read_only: true
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
  stop_grace_period: 30s
  mem_limit: 512m
  cpus: 0.75
  pids_limit: 128
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  environment: &environment
    NODE_ENV: production
    APP_ENV: production
    NODE_OPTIONS: --max-old-space-size=384
    PORT: "5000"
    FRONTEND_URL: ${PUBLIC_ORIGIN:?Set an exact HTTPS origin}
    APP_BASE_URL: ${PUBLIC_ORIGIN}
    CORS_ORIGIN: ${PUBLIC_ORIGIN}
    TRUST_PROXY: "1"
    COOKIE_SECURE: "true"
    AUTO_MIGRATE: "false"
    AUTO_SEED: "false"
    PGHOST: /var/run/postgresql
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB:?Set the reviewed database name}
    PGUSER: ${POSTGRES_USER:?Set the reviewed application database role}
    PGPASSWORD_FILE: /run/secrets/app_db_password
    PGMAX: "6"
    PGSSLMODE: disable
    INTEGRATION_ENCRYPTION_KEY_FILE: /run/secrets/integration_key
    NOTIFICATION_WORKER_ENABLED: "false"
    NOTIFICATION_MOCK_MODE: "false"
    TELEMETRY_MODE: live
    SHUTDOWN_TIMEOUT_MS: "25000"
    AWS_REGION: ap-south-1
    AWS_ALLOWED_REGIONS: ap-south-1
    AWS_LIFECYCLE_MUTATIONS_ENABLED: "false"
    DOCKER_LIFECYCLE_ENABLED: "false"
    KUBERNETES_LIFECYCLE_ENABLED: "false"
    REMEDIATION_EXECUTION_ENABLED: "false"
    REMEDIATION_PRODUCTION_ENABLED: "false"
    AWS_EC2_METADATA_DISABLED: "true"
  secrets: [app_db_password, integration_key]
  volumes: [postgres-socket:/var/run/postgresql:ro]
  networks: [application]
  depends_on:
    postgres: {condition: service_healthy}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a tested PostgreSQL 16 image reference pinned by digest}
    restart: unless-stopped
    network_mode: none
    # TCP disabled: only authenticated local Unix-socket connections are allowed.
    command: [postgres, -c, "listen_addresses=", -c, "password_encryption=scram-sha-256", -c, "max_connections=40", -c, "shared_buffers=128MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set a separate migration/backup administrator}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_db_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets: [admin_db_password]
    volumes: [postgres-data:/var/lib/postgresql/data, postgres-socket:/var/run/postgresql]
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h /var/run/postgresql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    <<: *application
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/api/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    <<: *application
    command: [node, src/entrypoint.js, worker]
    environment:
      <<: *environment
      WORKER_HEALTH_FILE: /tmp/infrapulse-worker-health.json
      WORKER_HEALTH_MAX_AGE_MS: "120000"
    healthcheck:
      test: [CMD, node, src/worker-health.js]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    image: ${FRONTEND_IMAGE:?Set a tested frontend image reference pinned by digest}
    init: true
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    restart: unless-stopped
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      backend: {condition: service_healthy}
    networks: [application]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 30s
    logging: *logs
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
    external: true
    name: ${PGDATA_VOLUME:?Explicitly select the separately prepared persistent volume}
  postgres-socket: {}
networks:
  application: {driver: bridge}
secrets:
  app_db_password: {file: "${APP_DB_PASSWORD_FILE:?Set an external application password file}"}
  admin_db_password: {file: "${ADMIN_DB_PASSWORD_FILE:?Set an external administrator password file}"}
  integration_key: {file: "${INTEGRATION_KEY_FILE:?Set an external encryption key file}"}
