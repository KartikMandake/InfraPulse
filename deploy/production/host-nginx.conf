# Template only: replace app.example.invalid and certificate paths before review.
# Install on the host separately; never expose container port 8080 publicly.
log_format infrapulse_safe '$remote_addr $request_method $uri $status $request_time';
server {
    listen 80;
    server_name app.example.invalid;
    return 308 https://app.example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name app.example.invalid;
    ssl_certificate /etc/infrapulse/tls/fullchain.pem;
    ssl_certificate_key /etc/infrapulse/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2M;
    access_log /var/log/nginx/infrapulse-access.log infrapulse_safe;
    error_log /var/log/nginx/infrapulse-error.log warn;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Correlation-ID '';
        proxy_read_timeout 40s;
        proxy_connect_timeout 5s;
    }
}
