# Only expose this listener on host loopback, behind the reviewed TLS edge.
map $http_x_forwarded_proto $trusted_proto { default http; https https; }
log_format infrapulse_frontend '$remote_addr $request_method $uri $status $request_time';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2M;
    # '$uri' omits query strings; correlation ID is validated by the backend.
    access_log /dev/stdout infrapulse_frontend;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $trusted_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /index.html { expires -1; }
    location = /healthz { access_log off; return 200 'healthy\n'; }
    location / { try_files $uri $uri/ /index.html; }
}
