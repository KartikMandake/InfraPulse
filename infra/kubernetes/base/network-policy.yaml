apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: infrapulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infrapulse
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: infrapulse
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: infrapulse
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: infrapulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infrapulse
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: infrapulse
              app.kubernetes.io/component: frontend
        - namespaceSelector: {} # Allow ingress controllers in kube-system or ingress namespaces
      ports:
        - protocol: TCP
          port: 5000

