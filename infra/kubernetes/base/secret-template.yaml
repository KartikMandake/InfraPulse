apiVersion: v1
kind: Secret
metadata:
  name: infrapulse-secrets
  namespace: infrapulse
  labels:
    app.kubernetes.io/name: infrapulse
    app.kubernetes.io/part-of: infrapulse
type: Opaque
stringData:
  # Base64 encoded or stringData placeholders
  # Replace with actual base64 encoded values or seal using SealedSecrets / ExternalSecrets in production
  POSTGRES_PASSWORD: "replace_with_secure_postgres_password"
  INTEGRATION_ENCRYPTION_KEY: "replace_with_random_32byte_aes256_secret_key!"
  SLACK_WEBHOOK_URL: "YOUR_SLACK_WEBHOOK_URL"

