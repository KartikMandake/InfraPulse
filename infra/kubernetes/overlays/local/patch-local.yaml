apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: infrapulse
spec:
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        storageClassName: local-path # Standard built-in default for K3s
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

