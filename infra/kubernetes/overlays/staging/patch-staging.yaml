apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: infrapulse
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: infrapulse
spec:
  replicas: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrapulse-config
  namespace: infrapulse
data:
  NODE_ENV: "production"
  APP_ENV: "staging"
  AUTO_MIGRATE: "false"
  AUTO_SEED: "false"
  PGSSLMODE: "verify-full"
  FRONTEND_URL: "https://staging.infrapulse.io"
  APP_BASE_URL: "https://staging.infrapulse.io"
  CORS_ORIGIN: "https://staging.infrapulse.io"
  COOKIE_SECURE: "true"

